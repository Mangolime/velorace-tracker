<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Велозаезд — отслеживание</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#map{background:#eee}
.panel{position:absolute;z-index:1000;top:60px;left:12px;background:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 2px 12px #0002;max-width:310px}
.title{font-weight:700;font-size:17px;margin-bottom:6px}
.status{font-size:13px;color:#555}
.legend{margin-top:8px;font-size:13px;line-height:1.5}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.kp{background:#555}.main{background:#2b78c5}.alt{background:#d05a3a}.kr{background:#8e44ad}
.kp-label{background:transparent;border:none;box-shadow:none;font-size:11px;font-weight:600;color:#222;text-shadow:0 0 4px #fff}
.kr-marker{width:28px;height:28px;border-radius:50%;background:#8e44ad;border:3px solid white;box-shadow:0 1px 6px #0008;color:white;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.count-marker{width:34px;height:34px;border-radius:50%;background:#333;border:3px solid white;box-shadow:0 1px 6px #0007;color:white;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.kp-marker{width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid #555;box-shadow:0 1px 5px #0006}
table{border-collapse:collapse;font-size:13px}
td,th{padding:3px 7px;border-bottom:1px solid #ddd;text-align:left}
</style>
</head>
<body>
<div class="panel">
  <div class="title">🚴 Отслеживание велозаезда</div>
  <div class="status" id="status">Загрузка…</div>
  <div class="legend">
    <div><span class="dot main"></span> основной маршрут</div>
    <div><span class="dot alt"></span> объезд через Зашеек</div>
    <div><span class="dot kp"></span> чекпойнт</div>
    <div><span class="dot kr"></span> Красков</div>
  </div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SHEET_ID = "1aU_QtwN_dyuxxvN-3DkFl0CwfCPxWH-ZdVDLDdIeZcU";
const RANGE = "Лист1!A:C";
const UPDATE_MS = 15 * 60 * 1000;

const map = L.map("map", {zoomControl: false}).setView([64.5,32.2], 7);
L.control.zoom({position: 'topleft'}).addTo(map);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let participantsLayer = L.layerGroup().addTo(map);

function icon(html, cls="") {
  return L.divIcon({html, className:cls, iconSize:null, iconAnchor:null});
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeCheckpoint(s) {
  return String(s || "")
    .replace(/^ЧЕКПОЙНТ\s+/i,"")
    .replace(/\s+/g," ")
    .replace(/\s*-\s*/g," - ")
    .trim();
}
function checkpointKey(s) {
  let x = normalizeCheckpoint(s).toLowerCase();
  x = x.replace("пяозерский (или софпорог)", "пяозерский");
  x = x.replace("софпорог (или пяозерский)", "софпорог");
  return x;
}

// --- Маршруты ---
fetch("main.geojson").then(r=>r.json()).then(g => {
  L.geoJSON(g,{style:{weight:4,opacity:.85,color:"#2b78c5"}}).addTo(map);
});
fetch("alt.geojson").then(r=>r.json()).then(g => {
  L.geoJSON(g,{style:{weight:4,opacity:.85,color:"#d05a3a",dashArray:"8 6"}}).addTo(map);
});

// --- Чекпойнты (исправленные координаты) ---
const checkpoints = [
  {name:"Харлу 53 км", lat:61.818814, lon:30.936934, key:"харлу"},
  {name:"Леппясюрья 116 км", lat:61.855420, lon:31.355277, key:"леппясюрья"},
  {name:"Вегарус 230 км", lat:62.300255, lon:32.099184, key:"вегарус"},
  {name:"Поросозеро 337 км", lat:62.718865, lon:32.716468, key:"поросозеро"},
  {name:"Гимолы 374 км", lat:62.933017, lon:32.524447, key:"гимолы"},
  {name:"Суккозеро 423 км", lat:63.169791, lon:32.342451, key:"суккозеро"},
  {name:"Шалговаара 549 км", lat:63.510380, lon:33.249540, key:"шалговаара"},
  {name:"Ругозеро 651 км", lat:64.079695, lon:32.776124, key:"ругозеро"},
  {name:"Новое Юшкозеро 792 км", lat:64.770958, lon:32.224795, key:"новое юшкозеро"},
  {name:"Луусалми 888 км", lat:65.057375, lon:31.562542, key:"луусалми"},
  {name:"Калевала 954 км", lat:65.200166, lon:31.177597, key:"калевала"},
  {name:"Тунгозеро 1028 км", lat:65.751001, lon:31.296859, key:"тунгозеро"},
  {name:"Пяозерский — 1038 км", lat:65.766882, lon:31.081024, key:"пяозерский"},
  {name:"Софпорог — 1038 км", lat:65.802911, lon:31.415336, key:"софпорог"},
  {name:"Зареченск 1212 км", lat:66.681929, lon:31.425583, key:"зареченск"},
  {name:"Кандалакша 1321 км", lat:67.129338, lon:32.428897, key:"кандалакша"}
];

const cpGroup = L.layerGroup().addTo(map);
checkpoints.forEach(cp => {
  const m = L.marker([cp.lat, cp.lon], {icon: icon('<div class="kp-marker"></div>')});
  m.bindTooltip(cp.name, {direction:"top", offset:[0,-6], permanent:true, className:'kp-label'});
  cpGroup.addLayer(m);
});

function findCheckpoint(name) {
  const key = checkpointKey(name);
  return checkpoints.find(c => c.key === key) || null;
}

async function refresh() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const rows = data.values;
    if (!rows || rows.length < 2) throw new Error("Нет данных");

    const head = rows[0].map(x => String(x).trim());
    const ixName = head.indexOf("Фамилия");
    const ixCp = head.indexOf("Последний пройденный КП");
    const ixTime = head.indexOf("Временная отметка");
    if (ixName < 0 || ixCp < 0 || ixTime < 0) throw new Error("Не найдены нужные столбцы");

    const people = rows.slice(1)
      .filter(r => r[ixName] && r[ixCp])
      .map(r => ({
        name: String(r[ixName]).trim(),
        cp: String(r[ixCp]).trim(),
        time: r[ixTime] ? String(r[ixTime]).trim() : ""
      }));

    participantsLayer.clearLayers();

    const groups = {};
    people.forEach(p => {
      const cp = findCheckpoint(p.cp);
      if (!cp) return;
      if (p.name === "Красков") {
        const m = L.marker([cp.lat, cp.lon], {icon: icon('<div class="kr-marker">К</div>')});
        m.bindPopup(`<b>Красков</b><br>${escapeHtml(cp.name)}<br>${escapeHtml(p.time)}`);
        participantsLayer.addLayer(m);
      } else {
        const k = cp.key;
        if (!groups[k]) groups[k] = {cp, people: []};
        groups[k].people.push(p);
      }
    });

    Object.values(groups).forEach(g => {
      g.people.sort((a,b) => a.time.localeCompare(b.time));
      const rowsHtml = g.people.map(p =>
        `<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.time)}</td></tr>`
      ).join("");
      const html = `<b>${escapeHtml(g.cp.name)}</b><br><br><table><tr><th>Участник</th><th>Время</th></tr>${rowsHtml}</table>`;
      const m = L.marker([g.cp.lat, g.cp.lon], {icon: icon(`<div class="count-marker">${g.people.length}</div>`)});
      m.bindPopup(html, {maxWidth: 360});
      participantsLayer.addLayer(m);
    });

    const now = new Date();
    document.getElementById("status").textContent =
      `Участников: ${people.length} · обновлено ${now.toLocaleString("ru-RU")}`;
  } catch(e) {
    document.getElementById("status").textContent = "Не удалось обновить данные: " + e.message;
  }
}

refresh();
setInterval(refresh, UPDATE_MS);
</script>
</body>
</html>
