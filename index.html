<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Велозаезд — отслеживание</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#map{background:#eee}
.panel{position:absolute;z-index:1000;top:12px;left:12px;background:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 2px 12px #0002;max-width:310px}
.title{font-weight:700;font-size:17px;margin-bottom:6px}
.status{font-size:13px;color:#555}
.legend{margin-top:8px;font-size:13px;line-height:1.5}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.kp{background:#555}.main{background:#2b78c5}.alt{background:#d05a3a}.kr{background:#8e44ad}
.kp-label{font-weight:700}
.kr-marker{width:28px;height:28px;border-radius:50%;background:#8e44ad;border:3px solid white;box-shadow:0 1px 6px #0008;color:white;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.count-marker{width:34px;height:34px;border-radius:50%;background:#333;border:3px solid white;box-shadow:0 1px 6px #0007;color:white;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.kp-marker{width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid #555;box-shadow:0 1px 5px #0006}
table{border-collapse:collapse;font-size:13px}
td,th{padding:3px 7px;border-bottom:1px solid #ddd;text-align:left}
</style>
</head>
<body>
<div class="panel">
  <div class="title">🚴 Отслеживание велозаезда</div>
  <div class="status" id="status">Загрузка…</div>
  <div class="legend">
    <div><span class="dot main"></span> основной маршрут</div>
    <div><span class="dot alt"></span> объезд через Зашеек</div>
    <div><span class="dot kp"></span> чекпойнт</div>
    <div><span class="dot kr"></span> Красков</div>
  </div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SHEET_ID = "1aU_QtwN_dyuxxvN-3DkFl0CwfCPxWH-ZdVDLDdIeZcU";
const SHEET_GID = "0";
const UPDATE_MS = 15 * 60 * 1000;

const map = L.map("map", {preferCanvas:true}).setView([64.5,32.2], 7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let participantsLayer = L.layerGroup().addTo(map);

function icon(html, cls="") {
  return L.divIcon({html, className:cls, iconSize:null, iconAnchor:null});
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeCheckpoint(s) {
  return String(s || "")
    .replace(/^ЧЕКПОЙНТ\s+/i,"")
    .replace(/\s+/g," ")
    .replace(/\s*-\s*/g," - ")
    .trim();
}
function checkpointKey(s) {
  let x = normalizeCheckpoint(s).toLowerCase();
  x = x.replace("пяозерский (или софпорог)", "пяозерский");
  x = x.replace("софпорог (или пяозерский)", "софпорог");
  return x;
}
function parseCsv(text) {
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c==='"' && q && n==='"'){cell+='"';i++;continue}
    if(c==='"'){q=!q;continue}
    if(c===',' && !q){row.push(cell);cell="";continue}
    if((c==='\n'||c==='\r') && !q){
      if(c==='\r' && n==='\n') i++;
      row.push(cell);cell="";
      if(row.some(v=>v.trim()!=="")) rows.push(row);
      row=[];continue;
    }
    cell+=c;
  }
  if(cell!=="" || row.length){row.push(cell);rows.push(row)}
  return rows;
}

fetch("main.geojson").then(r=>r.json()).then(g => {
  L.geoJSON(g,{style:{weight:4,opacity:.85,color:"#2b78c5"}}).addTo(map);
});
fetch("alt.geojson").then(r=>r.json()).then(g => {
  L.geoJSON(g,{style:{weight:4,opacity:.85,color:"#d05a3a",dashArray:"8 6"}}).addTo(map);
});

let checkpoints = [];
fetch("checkpoints.geojson").then(r=>r.json()).then(g => {
  checkpoints = g.features.map(f => ({
    name:f.properties.name,
    route:f.properties.route,
    lat:f.geometry.coordinates[1],
    lon:f.geometry.coordinates[0],
    key:checkpointKey(f.properties.name)
  }));
  const group=L.layerGroup().addTo(map);
  checkpoints.forEach(cp=>{
    const m=L.marker([cp.lat,cp.lon],{icon:icon('<div class="kp-marker"></div>')});
    m.bindTooltip(cp.name,{direction:"top",offset:[0,-6]});
    group.addLayer(m);
  });
  const all = L.featureGroup([
    L.geoJSON(g),
  ]);
});

function findCheckpoint(name) {
  const key=checkpointKey(name);
  return checkpoints.find(c=>c.key===key) || checkpoints.find(c=>key.includes(c.key)||c.key.includes(key));
}

async function refresh() {
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${SHEET_GID}&_=${Date.now()}`;
  try {
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const rows=parseCsv(await res.text());
    if(!rows.length) throw new Error("Пустая таблица");
    const head=rows[0].map(x=>x.trim());
    const ixName=head.indexOf("Фамилия");
    const ixCp=head.indexOf("Последний пройденный КП");
    const ixTime=head.indexOf("Временная отметка");
    if(ixName<0||ixCp<0||ixTime<0) throw new Error("Не найдены нужные столбцы");

    const people=rows.slice(1).filter(r=>r[ixName] && r[ixCp]).map(r=>({
      name:r[ixName].trim(),
      cp:r[ixCp].trim(),
      time:r[ixTime] ? r[ixTime].trim() : ""
    }));

    participantsLayer.clearLayers();
    const groups={};
    people.forEach(p=>{
      const cp=findCheckpoint(p.cp);
      if(!cp) return;
      if(p.name==="Красков") {
        const m=L.marker([cp.lat,cp.lon],{icon:icon('<div class="kr-marker">К</div>')});
        m.bindPopup(`<b>Красков</b><br>${escapeHtml(cp.name)}<br>${escapeHtml(p.time)}`);
        participantsLayer.addLayer(m);
      } else {
        const k=cp.key;
        if(!groups[k]) groups[k]={cp,people:[]};
        groups[k].people.push(p);
      }
    });
    Object.values(groups).forEach(g=>{
      g.people.sort((a,b)=>a.time.localeCompare(b.time));
      const rowsHtml=g.people.map(p=>`<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.time)}</td></tr>`).join("");
      const html=`<b>${escapeHtml(g.cp.name)}</b><br><br><table><tr><th>Участник</th><th>Время</th></tr>${rowsHtml}</table>`;
      const m=L.marker([g.cp.lat,g.cp.lon],{icon:icon(`<div class="count-marker">${g.people.length}</div>`)});
      m.bindPopup(html,{maxWidth:360});
      participantsLayer.addLayer(m);
    });

    const now=new Date();
    document.getElementById("status").textContent =
      `Участников: ${people.length} · обновлено ${now.toLocaleString("ru-RU")}`;
  } catch(e) {
    document.getElementById("status").textContent =
      "Не удалось обновить данные: "+e.message;
  }
}
refresh();
setInterval(refresh, UPDATE_MS);
</script>
</body>
</html>
